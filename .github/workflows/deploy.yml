name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: age-app/package-lock.json
    
    - name: Install dependencies
      working-directory: ./age-app
      run: make install
    
    - name: Build application
      working-directory: ./age-app
      run: make build
    
